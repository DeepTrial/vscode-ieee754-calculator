<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#569cd6"/>
      <stop offset="100%" stop-color="#4fc3f7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="1" y="1" width="22" height="22" rx="6" fill="url(#bg)"/>

  <!-- Floating point representation - three horizontal segments -->
  <!-- Sign bit (top) -->
  <rect x="5" y="6" width="14" height="3" rx="1.5" fill="#d16969" opacity="0.9" filter="url(#glow)"/>

  <!-- Exponent bits (middle) -->
  <rect x="5" y="10.5" width="14" height="3" rx="1.5" fill="#ce9178" opacity="0.9"/>

  <!-- Mantissa bits (bottom) -->
  <rect x="5" y="15" width="14" height="3" rx="1.5" fill="url(#accent)" opacity="0.9"/>

  <!-- Decimal point indicator -->
  <circle cx="12" cy="21" r="1.2" fill="#d4d4d4" opacity="0.7"/>
</svg>
