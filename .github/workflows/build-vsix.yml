name: Build VSIX

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Git tag for release (e.g. v0.1.0, leave empty for manual build)"
        required: false
        type: string

jobs:
  build:
    name: Build and package VSIX
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Package VSIX
        run: npm run package

      - name: Rename VSIX
        run: |
          VSIX_FILE=$(ls *.vsix | head -1)
          cp "$VSIX_FILE" ieee754-calculator.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: ieee754-calculator-vsix
          path: ieee754-calculator.vsix
          retention-days: 30

      - name: Create Release and Tag
        if: ${{ github.event.inputs.tag_name != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.event.inputs.tag_name }}" \
            ieee754-calculator.vsix \
            --title "Release ${{ github.event.inputs.tag_name }}" \
            --generate-notes \
            --latest
